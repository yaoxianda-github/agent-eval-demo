# agent-eval 质量门禁 —— 合并阻断验证演示
#
# 链路：PR/push → 安装 agent-eval → 无头跑 demo 门禁 → 失败退出码 1 → job 失败
#      → dorny/test-reporter 在 PR 评论 JUnit 结果 → branch protection required check 阻断合并
#
# 正式接入时把 --gate demo 换成 --gate core（见 ci/gate.yaml），并在
# Settings > Branches 为 main 添加 required status check: agent-eval demo gate。

name: agent-eval gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write      # test-reporter 写入 check
  pull-requests: write
  issues: write

jobs:
  eval:
    name: agent-eval demo gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 agent-eval（主仓库）
        run: pip install --upgrade pip && pip install git+https://github.com/yaoxianda-github/ai-agent-eval.git

      - name: 准备 python 命令（ubuntu 24.04 无 python 软链，verify 脚本依赖）
        run: sudo ln -sf /usr/bin/python3 /usr/local/bin/python && python --version

      - name: 运行 demo 门禁（无头模式）
        id: gate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          agent-eval ci --gate demo \
            --junit-xml results/junit.xml \
            --allure-dir results/allure-results \
            --report-json results/ci-report.json
        # 门禁失败退出码 1 -> job 失败 -> required check 阻断合并

      - name: 发布 JUnit 报告到 PR 评论
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: agent-eval demo gate (JUnit)
          path: results/junit.xml
          reporter: java-junit

      # 注：simple-elf/allure-report-action 为 Docker 容器 action，在部分
      # ubuntu-latest runner 上 Docker 构建失败；Allure results 随 artifact
      # 上传，可在本地执行 `allure generate results/allure-results` 出报告。

      - name: 上传门禁汇总
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: |
            results/junit.xml
            results/ci-report.json
            results/allure-results/
          if-no-files-found: ignore
